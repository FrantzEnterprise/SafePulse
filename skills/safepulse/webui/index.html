<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafePulse — Safe Failure Prediction</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --red: #ef4444;
    --critical: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem;
  }
  .container { max-width: 800px; width: 100%; }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header h1 { font-size: 1.75rem; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header p { color: var(--text-muted); margin-top: 0.25rem; font-size: 0.9rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .form-grid .full { grid-column: 1 / -1; }

  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  select { cursor: pointer; }

  .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .checkbox-label {
    display: flex; align-items: center; gap: 0.4rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .checkbox-label:hover { border-color: var(--accent); }
  .checkbox-label.checked { border-color: var(--accent); background: rgba(59,130,246,0.1); }
  .checkbox-label input { display: none; }
  .checkbox-label .check { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.2s; flex-shrink: 0; }
  .checkbox-label.checked .check { background: var(--accent); border-color: var(--accent); }
  .checkbox-label.checked .check::after { content: "✓"; color: #fff; font-weight: 700; }

  .submit-btn {
    width: 100%;
    padding: 0.85rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }
  .submit-btn:hover { background: var(--accent-hover); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner { display: none; }
  .submit-btn.loading .spinner { display: inline-block; }
  .submit-btn.loading .label { display: none; }

  /* Result */
  #result { display: none; }
  #result.visible { display: block; }

  .risk-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }
  .risk-badge.low { background: rgba(34,197,94,0.15); color: var(--green); }
  .risk-badge.moderate { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .risk-badge.high { background: rgba(249,115,22,0.15); color: var(--orange); }
  .risk-badge.critical { background: rgba(220,38,38,0.15); color: var(--critical); }

  .result-section { margin-bottom: 1rem; }
  .result-section h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .result-section p { line-height: 1.5; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .result-stat { background: var(--bg); border-radius: 8px; padding: 0.75rem; }
  .result-stat .stat-label { font-size: 0.75rem; color: var(--text-muted); }
  .result-stat .stat-value { font-size: 0.9rem; font-weight: 600; margin-top: 0.15rem; }

  /* Safety notice */
  .safety-notice {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    color: #fca5a5;
    margin-bottom: 1rem;
    text-align: center;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: 1fr; }
  }

  .spinner-icon {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .batch-link {
    text-align: center; margin-top: 1.5rem;
  }
  .batch-link a {
    color: var(--text-muted); font-size: 0.85rem;
    text-decoration: underline dotted;
  }
  .batch-link a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Safe<span>Pulse</span></h1>
    <p>Safe Failure Prediction — Preventive Diagnostics for Technicians</p>
  </header>

  <div class="safety-notice">
    ⚠️ Preventive diagnostics only. No bypass, drill points, or defeat instructions.
  </div>

  <div class="card">
    <h2>Safe Assessment</h2>
    <div class="form-grid">
      <div>
        <label for="brand">Safe Brand</label>
        <select id="brand">
          <option value="Unknown">Unknown / Other</option>
          <option value="AMSEC">AMSEC</option>
          <option value="Sentry">Sentry</option>
          <option value="Mosler">Mosler</option>
          <option value="Gardall">Gardall</option>
          <option value="Liberty">Liberty</option>
          <option value="Sturdy">Sturdy</option>
          <option value="Chubb">Chubb</option>
        </select>
      </div>
      <div>
        <label for="lock_type">Lock Type</label>
        <select id="lock_type">
          <option value="mechanical_combination">Mechanical Combination</option>
          <option value="electronic">Electronic</option>
          <option value="key_lock">Key Lock</option>
          <option value="redundant">Redundant (Mech + Elec)</option>
        </select>
      </div>
      <div>
        <label for="age">Approximate Age (years)</label>
        <input type="number" id="age" min="0" max="150" value="15">
      </div>
      <div>
        <label for="usage">Usage Frequency</label>
        <select id="usage">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="rarely">Rarely</option>
        </select>
      </div>
      <div>
        <label for="humidity">Environment Humidity</label>
        <select id="humidity">
          <option value="medium">Medium</option>
          <option value="low">Low</option>
          <option value="high">High</option>
        </select>
      </div>
      <div>
        <label for="last_service">Years Since Last Service</label>
        <input type="number" id="last_service" min="0" max="100" value="5">
      </div>

      <div class="full">
        <label>Environment Conditions</label>
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <label class="checkbox-label" id="garage-label">
            <input type="checkbox" id="garage">
            <span class="check"></span> Garage / Outbuilding
          </label>
          <label class="checkbox-label" id="corrosion-label">
            <input type="checkbox" id="corrosion">
            <span class="check"></span> Corrosion Visible
          </label>
        </div>
      </div>

      <div class="full">
        <label>Symptoms (select all that apply)</label>
        <div class="checkbox-group" id="symptoms-group">
          <label class="checkbox-label" data-symptom="dial_drag"><input type="checkbox"><span class="check"></span> Dial Drag</label>
          <label class="checkbox-label" data-symptom="dial_loose"><input type="checkbox"><span class="check"></span> Dial Loose</label>
          <label class="checkbox-label" data-symptom="handle_pressure"><input type="checkbox"><span class="check"></span> Handle Pressure</label>
          <label class="checkbox-label" data-symptom="handle_slipping"><input type="checkbox"><span class="check"></span> Handle Slipping</label>
          <label class="checkbox-label" data-symptom="intermittent_opening"><input type="checkbox"><span class="check"></span> Intermittent Opening</label>
          <label class="checkbox-label" data-symptom="no_spin_change"><input type="checkbox"><span class="check"></span> Can't Change Combo</label>
          <label class="checkbox-label" data-symptom="electronic_failure"><input type="checkbox"><span class="check"></span> Electronic Failure</label>
          <label class="checkbox-label" data-symptom="battery_corrosion"><input type="checkbox"><span class="check"></span> Battery Corrosion</label>
          <label class="checkbox-label" data-symptom="door_drag"><input type="checkbox"><span class="check"></span> Door Drag</label>
          <label class="checkbox-label" data-symptom="locking_bolts_sticky"><input type="checkbox"><span class="check"></span> Locking Bolts Sticky</label>
        </div>
      </div>

      <div class="full">
        <label for="report">Customer Report (free text)</label>
        <textarea id="report" placeholder="e.g. It's getting harder to open every month..."></textarea>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="runPrediction()">
      <span class="label">Run Prediction</span>
      <span class="spinner"><span class="spinner-icon"></span> Analyzing...</span>
    </button>
  </div>

  <div class="card" id="result">
    <div id="risk-badge-container"></div>
    <div id="result-content"></div>
    <div class="result-grid" id="result-stats"></div>
    <div class="batch-link">
      <a href="#" onclick="resetForm();return false;">← New Assessment</a>
    </div>
  </div>
</div>

<script>
// Toggle checkbox label styling
document.querySelectorAll('.checkbox-label').forEach(el => {
  el.addEventListener('click', function(e) {
    if (e.target.tagName === 'INPUT') return;
    const cb = this.querySelector('input[type=checkbox]');
    cb.checked = !cb.checked;
    this.classList.toggle('checked', cb.checked);
  });
  const cb = el.querySelector('input');
  if (cb) {
    cb.addEventListener('change', function() {
      el.classList.toggle('checked', this.checked);
    });
  }
});

// Single condition toggles
['garage', 'corrosion'].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener('change', function() {
      document.getElementById(id+'-label').classList.toggle('checked', this.checked);
    });
  }
});

async function runPrediction() {
  const btn = document.getElementById('submit-btn');
  btn.classList.add('loading');
  btn.disabled = true;
  document.getElementById('result').classList.remove('visible');

  const symptoms = [];
  document.querySelectorAll('#symptoms-group .checkbox-label').forEach(el => {
    if (el.querySelector('input').checked) {
      symptoms.push(el.dataset.symptom);
    }
  });

  const input = {
    safe_brand: document.getElementById('brand').value,
    lock_type: document.getElementById('lock_type').value,
    approx_age_years: parseInt(document.getElementById('age').value) || 0,
    symptoms: symptoms,
    environment: {
      humidity: document.getElementById('humidity').value,
      garage_or_outbuilding: document.getElementById('garage').checked,
      corrosion_visible: document.getElementById('corrosion').checked
    },
    usage_frequency: document.getElementById('usage').value,
    last_service_years_ago: parseInt(document.getElementById('last_service').value) || null,
    customer_report: document.getElementById('report').value
  };

  // Avoid sending 0 as "never" — if age is 0 or last_service is 0 that's misleading
  if (input.last_service_years_ago === 0) input.last_service_years_ago = null;

  try {
    const resp = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(input)
    });

    if (!resp.ok) {
      const err = await resp.text();
      showResult(input, null, 'Error: ' + err);
      return;
    }

    const data = await resp.json();
    showResult(input, data, null);
  } catch (e) {
    // If server not available, run prediction via local call
    try {
      const data = await localPredict(input);
      showResult(input, data, null);
    } catch(e2) {
      showResult(input, null, 'Prediction failed: ' + e2.message);
    }
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showResult(input, data, error) {
  const container = document.getElementById('result');
  const badgeContainer = document.getElementById('risk-badge-container');
  const content = document.getElementById('result-content');
  const stats = document.getElementById('result-stats');

  container.classList.add('visible');

  if (error) {
    badgeContainer.innerHTML = `<div class="risk-badge" style="background:rgba(239,68,68,0.15);color:#ef4444;">⚠️ Error</div>`;
    content.innerHTML = `<p style="color:#fca5a5;">${error}</p>`;
    stats.innerHTML = '';
    return;
  }

  const risk = (data.risk || 'low').toLowerCase();
  const icons = { low: '✅', moderate: '⚡', high: '🚨', critical: '🔴' };
  const icon = icons[risk] || '⚠️';

  badgeContainer.innerHTML = `<div class="risk-badge ${risk}">${icon} ${data.risk} Risk</div>`;

  content.innerHTML = `
    <div class="result-section">
      <h3>Likely Failure Cause</h3>
      <p>${data.likely_cause || data.likelyFailureCause || 'Not identified.'}</p>
    </div>
    <div class="result-section">
      <h3>Technician Notes</h3>
      <p>${data.technician_notes || data.technicianNotes || '—'}</p>
    </div>
    <div class="result-section">
      <h3>Recommended Action</h3>
      <p>${data.recommended_action || data.recommendedAction || '—'}</p>
    </div>
    <div class="result-section">
      <h3>Customer-Friendly Explanation</h3>
      <p>${data.customer_explanation || data.customerExplanation || '—'}</p>
    </div>
  `;

  stats.innerHTML = `
    <div class="result-stat"><div class="stat-label">Safe</div><div class="stat-value">${input.safe_brand} (${input.approx_age_years} yrs)</div></div>
    <div class="result-stat"><div class="stat-label">Lock Type</div><div class="stat-value">${input.lock_type.replace(/_/g,' ')}</div></div>
    <div class="result-stat"><div class="stat-label">Parts / Tools</div><div class="stat-value" style="font-weight:400;font-size:0.85rem;">${data.parts_tools || data.partsTools || 'Standard service kit'}</div></div>
    <div class="result-stat"><div class="stat-label">Follow-Up</div><div class="stat-value">${data.follow_up_months || data.followUpMonths || '12'} months</div></div>
  `;

  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
  document.getElementById('result').classList.remove('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Local fallback prediction (calls predict.sh via fetch or inline) ---
async function localPredict(input) {
  // If the server endpoint is not available, we POST to predict.sh through Node
  const resp = await fetch('/api/predict', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(input)
  });
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}
</script>
</body>
</html>
